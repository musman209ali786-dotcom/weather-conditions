<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>My Weather App</title>
    <link rel="stylesheet" href="styling.css">
</head>
<body>
    <h1>
        Weather
    </h1>
    <section class="weather-card">
        <h1 class="weather-condition">
            🌤️
        </h1> <br>
        <p class="City-name"> New York</p> 
        <p class="temp"> 72°F</p> 
        <p class="condition"> Partly Cloudy
    </section>
    <br>
    <section class="Weekly Weather Forecast">
        <h2 class="Forecast"> Weather Forecast</h2>
        <h1 class="days"> <strong>Days</strong></h1>
        <h3>
            Monday
        </h3>
        <p> Rainy + cloudy 🌧️</p>
        <h3>
            Tuesday
        </h3>
            <p> Sunny ☀️</p>
        <h3>
            Wednesday
        </h3>
            <p> Sunny + Clouds ⛅</p>
        
    </section>

</body>
