<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Food Menu</title>
    <style>
        body{
            font-family: Arial;
            background-color: white;
            padding: 10px;
            text-align: center;
        }
        h1{
            color: lightcyan;
            font-size: 25px;
            font-weight: bolder;
        }
        h1 + p{
            background-color: aqua;
            padding: 10px;
            border-radius: 12px;
            color: black;
        }
        ul{
            padding: 0px;
            margin-top: 20px;
        }
        ul >  li{
            font-style: italic;
            font-weight: normal;
            background-color: crimson;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        ul li:nth-child(2) {
            background-color: darkgray;
            color: aqua;
        }
        .desc{
            color: bisque;
            padding: 10px;
            margin-top: 12px;
            font-size: 15px;
            width: 12px;
        }
        p::first-letter{
            font-size: large;
            font-weight: bold;
        }
        .links{
            padding-top: 10px;
            margin-top: 10px;
        }
        a:hover{
            color: aqua;
            border: aqua;
            padding: 10px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <h1>Element foods</h1>
    <p>elements compunds mixtures foods</p>
    <ul>
        <li>Chicken pasta</li>
        <li>uranium salad</li>
        <li>lithium chapati</li>
        <li>iron roll</li>
    </ul>
    <p class="desc">chicken pasta is of chicken</p>
    <p class="desc">uranium salad is of uranium</p>
    <p class="desc">lithium chapati is of lithium</p>
    <p class="desc">iron roll is for tanks</p>
    <div class="links">
        <a href="google.com">Google</a> <br>
        <a href="youtube.com">Youtube</a>
    </div>
</body>
</html>
